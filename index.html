<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Studyverse — a gamified 3D study-timer world. Earn coins, fly to new cities, customize your character, and study with friends worldwide.">
  <meta name="theme-color" content="#0f1020">
  <title>Studyverse — Study. Travel. Connect.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/study.css">
</head>
<body>

<!-- 3D world canvas -->
<canvas id="canvas"></canvas>

<!-- ───────────── ONBOARDING ───────────── -->
<div id="onboarding" class="hidden">
  <div id="onboarding-card"></div>
</div>

<!-- ───────────── HUD ───────────── -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-chip hud-logo">🧳 <span class="grad">Studyverse</span></div>
    <div class="hud-stats">
      <div class="hud-chip hidden" id="hud-online">🟢 <span>1</span> online</div>
      <div class="hud-chip">⭐ <span id="hud-coins">0</span></div>
      <div class="hud-chip">🔥 <span id="hud-streak">0</span></div>
      <div class="hud-chip">✈️ <span id="hud-miles">0</span> mi</div>
    </div>
  </div>

  <div id="enter-prompt" class="hidden">
    <span class="kbd">E</span> Enter <b id="enter-prompt-name"></b>
  </div>

  <div class="hud-nav">
    <button class="nav-btn" data-nav="dashboard"><span class="ni">🏠</span>Home</button>
    <button class="nav-btn" data-nav="travel"><span class="ni">✈️</span>Fly</button>
    <button class="nav-btn" data-nav="shop"><span class="ni">🛍️</span>Shop</button>
    <button class="nav-btn" data-nav="quests"><span class="ni">📋</span>Quests</button>
    <button class="nav-btn" data-nav="passport"><span class="ni">🛂</span>Passport</button>
    <button class="nav-btn" data-nav="friends"><span class="ni">🤝</span>Friends</button>
    <button class="nav-btn" data-nav="chat"><span class="ni">💬</span>Chat<span id="nav-chat-dot" class="nav-dot hidden"></span></button>
    <button class="nav-btn" data-nav="profile"><span class="ni">👤</span>Profile</button>
  </div>
</div>

<!-- ───────────── MOBILE CONTROLS ───────────── -->
<div id="mobile-controls" class="hidden">
  <div id="joystick"><div id="joystick-stick"></div></div>
</div>

<!-- ───────────── STUDY SESSION UI ───────────── -->
<div id="study-ui" class="hidden"></div>

<!-- ───────────── GENERIC PANEL (modal) ───────────── -->
<div id="panel">
  <div class="panel-inner">
    <div class="panel-head">
      <h2 id="panel-title">Panel</h2>
      <button class="panel-x" id="panel-close">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

<!-- ───────────── CHAT PANEL ───────────── -->
<div id="chat-panel">
  <div class="chat-head">
    <h3 id="chat-room-name">Global Chat</h3>
    <button class="panel-x" id="chat-close">✕</button>
  </div>
  <div id="chat-tabs">
    <button class="ctab active" data-room="global">🌍 Global</button>
    <button class="ctab" data-room="lobby">🛋️ Study Lobby</button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-typing" class="hidden"></div>
  <div class="chat-input-bar">
    <button class="icon-btn" id="chat-emoji-btn">😊</button>
    <input id="chat-input" placeholder="Type a message..." maxlength="240" />
    <button class="btn btn-primary" id="chat-send">➤</button>
    <div id="emoji-tray" class="hidden"></div>
  </div>
</div>

<!-- ───────────── TOASTS ───────────── -->
<div id="toast-wrap"></div>

<!-- ───────────── SCRIPTS ───────────── -->
<script src="js/three.min.js"></script>
<script src="js/supabase.umd.js"></script>
<script src="js/study-config.js"></script>
<script src="js/study-data.js"></script>
<script src="js/study-net.js"></script>
<script src="js/study-world.js"></script>
<script src="js/study-app.js"></script>
</body>
</html>
